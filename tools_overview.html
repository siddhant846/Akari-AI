<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akari AI — Tool Ecosystem Directory</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(22, 27, 34, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-pink: #ff4d8d;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(255, 77, 141, 0.15) 0%, transparent 40%),
                  var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: "Plus Jakarta Sans", sans-serif;
      padding: 40px 24px;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
    }
    .title-group h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #ff4d8d 50%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .title-group p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .stat-card .num {
      font-size: 36px;
      font-weight: 800;
      color: #fff;
    }
    .stat-card .label {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 280px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 18px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .search-box:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 3px rgba(255, 77, 141, 0.2);
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: rgba(255, 77, 141, 0.2);
      border-color: var(--accent-pink);
      color: #fff;
    }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 14px;
    }
    .tool-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.15s, border-color 0.15s;
    }
    .tool-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .tool-info {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }
    .tool-num {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--text-muted);
      min-width: 24px;
    }
    .tool-name {
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      font-weight: 600;
      color: #f9fafb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tags {
      display: flex;
      gap: 6px;
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tag-gemini {
      background: rgba(139, 92, 246, 0.2);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.4);
    }
    .tag-python {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .launch-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ff4d8d, #8b5cf6);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(255, 77, 141, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .launch-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 77, 141, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">

        <p>Live synchronized catalog of all Gemini Live and Python Desktop Control Agent tools</p>

        <span class="label">Gemini Live Declarations</span>

      <div class="stat-card">
        <span class="num" style="color: #34d399;">116</span>
        <span class="label">Python Agent Tools</span>

    </div>

    <div class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Search tool by name (e.g. browser, file, volume, brightness)..." autofocus>
      <button class="filter-btn active" onclick="setFilter("all")">All (125)</button>
      <button class="filter-btn" onclick="setFilter("gemini")">Gemini Live (98)</button>
      <button class="filter-btn" onclick="setFilter("python")">Python Agent (116)</button>
      <button class="filter-btn" onclick="setFilter("dual")">Dual-Integrated</button>
    </div>

    <div class="tools-grid" id="toolsGrid"></div>
  </div>

      const filtered = tools.filter(t => {
        const matchesQuery = t.name.toLowerCase().includes(query);
        if (!matchesQuery) return false;
